<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dutch Verb Trainer — Werkwoorden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F5F3EE;
  --surface: #FFFFFF;
  --surface2: #F0EDE6;
  --border: #E2DDD5;
  --border2: #C8C2B8;
  --text: #1A1714;
  --text2: #5C574F;
  --text3: #9C9589;
  --accent: #2B5FE8;
  --accent-bg: #EEF2FD;
  --accent-text: #1A3D9A;
  --green: #1A7A55;
  --green-bg: #E6F5EE;
  --red: #C0392B;
  --red-bg: #FDF0EE;
  --amber: #8B5E00;
  --amber-bg: #FFF4DC;
  --radius: 10px;
  --radius-lg: 16px;
  --radius-xl: 22px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Sora', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding: 0;
}

.app {
  max-width: 640px;
  margin: 0 auto;
  padding: 24px 16px 48px;
}

/* ── HEADER ── */
.site-header {
  text-align: center;
  margin-bottom: 28px;
  padding-top: 8px;
}
.site-title {
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 0.12em;
  color: var(--text3);
  text-transform: uppercase;
}
.site-title span {
  color: var(--accent);
  font-family: 'DM Mono', monospace;
}

/* ── SCREENS ── */
.screen { display: none; }
.screen.active { display: block; }

/* ── CARD ── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-xl);
  padding: 20px;
  margin-bottom: 14px;
}

.card-title {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text3);
  margin-bottom: 14px;
}

/* ── TYPE PILLS ── */
.type-pills {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.pill {
  padding: 8px 16px;
  border: 1.5px solid var(--border2);
  border-radius: 40px;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  color: var(--text2);
  background: transparent;
  transition: all 0.15s;
  font-family: 'Sora', sans-serif;
}
.pill:hover { border-color: var(--accent); color: var(--accent); }
.pill.active {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}

/* ── VERB SELECTION ── */
.select-actions {
  display: flex;
  gap: 12px;
  margin-bottom: 10px;
}
.select-actions button {
  font-size: 12px;
  font-weight: 500;
  color: var(--accent);
  background: none;
  border: none;
  cursor: pointer;
  font-family: 'Sora', sans-serif;
  padding: 2px 0;
  text-decoration: underline;
  text-underline-offset: 3px;
}
.verb-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
  gap: 6px;
  max-height: 220px;
  overflow-y: auto;
  padding-right: 4px;
}
.verb-chip {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 7px 10px;
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  cursor: pointer;
  font-size: 13px;
  font-weight: 400;
  color: var(--text2);
  background: var(--surface2);
  transition: all 0.12s;
  user-select: none;
}
.verb-chip:hover { border-color: var(--accent); }
.verb-chip.selected {
  background: var(--accent-bg);
  border-color: var(--accent);
  color: var(--accent-text);
  font-weight: 500;
}
.verb-chip .chk {
  width: 14px;
  height: 14px;
  border-radius: 4px;
  border: 1.5px solid var(--border2);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.12s;
}
.verb-chip.selected .chk {
  background: var(--accent);
  border-color: var(--accent);
}
.verb-chip.selected .chk::after {
  content: '';
  display: block;
  width: 8px;
  height: 5px;
  border-left: 1.5px solid #fff;
  border-bottom: 1.5px solid #fff;
  transform: rotate(-45deg) translate(1px, -1px);
}

/* ── MODE BUTTONS ── */
.mode-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.mode-btn {
  flex: 1;
  min-width: 100px;
  padding: 9px 12px;
  border: 1.5px solid var(--border2);
  border-radius: var(--radius);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  color: var(--text2);
  background: var(--surface2);
  transition: all 0.13s;
  text-align: center;
  font-family: 'Sora', sans-serif;
}
.mode-btn:hover { border-color: var(--accent); color: var(--accent); }
.mode-btn.active {
  background: var(--accent-bg);
  border-color: var(--accent);
  color: var(--accent-text);
}

/* ── START BUTTON ── */
.start-btn {
  width: 100%;
  padding: 16px;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: var(--radius-xl);
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  font-family: 'Sora', sans-serif;
  transition: opacity 0.15s, transform 0.1s;
  margin-top: 4px;
}
.start-btn:hover { opacity: 0.88; }
.start-btn:active { transform: scale(0.98); }
.start-btn:disabled { opacity: 0.35; cursor: not-allowed; }

/* ── QUIZ SCREEN ── */
.quiz-topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}
.q-counter {
  font-size: 13px;
  font-weight: 500;
  color: var(--text3);
  font-family: 'DM Mono', monospace;
}
.quit-btn {
  padding: 6px 14px;
  border: 1.5px solid var(--border2);
  border-radius: 40px;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  background: transparent;
  color: var(--text2);
  font-family: 'Sora', sans-serif;
  transition: all 0.13s;
}
.quit-btn:hover { border-color: var(--red); color: var(--red); }

.progress-wrap {
  background: var(--surface2);
  border-radius: 4px;
  height: 5px;
  margin-bottom: 20px;
  overflow: hidden;
  border: 1px solid var(--border);
}
.progress-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 4px;
  transition: width 0.35s cubic-bezier(0.4,0,0.2,1);
}

.tense-badge {
  display: inline-block;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 4px 10px;
  border-radius: 20px;
  background: var(--accent-bg);
  color: var(--accent-text);
  margin-bottom: 16px;
  border: 1px solid rgba(43,95,232,0.15);
}

/* ── LANGUAGE SWITCHER ── */
.lang-switcher {
  display: flex;
  gap: 4px;
  justify-content: flex-end;
  margin-bottom: 12px;
}
.lang-btn {
  padding: 4px 10px;
  border: 1.5px solid var(--border2);
  border-radius: 20px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.05em;
  cursor: pointer;
  background: transparent;
  color: var(--text3);
  font-family: 'Sora', sans-serif;
  transition: all 0.13s;
}
.lang-btn.active {
  background: var(--text);
  border-color: var(--text);
  color: var(--bg);
}

/* ── BIG VERB + PRONOUN TAG ── */
.quiz-center {
  text-align: center;
  padding: 12px 0 20px;
}
.verb-big {
  font-size: 42px;
  font-weight: 600;
  color: var(--text);
  line-height: 1.1;
  margin-bottom: 14px;
  font-family: 'Sora', sans-serif;
  letter-spacing: -0.01em;
}
.verb-big.perfect-mode {
  font-size: 30px;
}
.pronoun-tag-wrap {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-bottom: 4px;
}
.pronoun-label-small {
  font-size: 12px;
  font-weight: 500;
  color: var(--text3);
  text-transform: uppercase;
  letter-spacing: 0.08em;
}
.pronoun-tag {
  display: inline-flex;
  align-items: center;
  gap: 0;
  background: var(--accent);
  color: #fff;
  border-radius: 8px;
  padding: 4px 14px;
  font-size: 17px;
  font-weight: 600;
  font-family: 'DM Mono', monospace;
  letter-spacing: 0.02em;
}

/* ── ANSWER INPUT ── */
.answer-wrap { margin-top: 20px; }
.answer-input {
  width: 100%;
  padding: 14px 18px;
  font-size: 20px;
  font-family: 'DM Mono', monospace;
  font-weight: 500;
  border: 2px solid var(--border2);
  border-radius: var(--radius-lg);
  background: var(--surface);
  color: var(--text);
  outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
  text-align: center;
}
.answer-input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 4px rgba(43,95,232,0.1);
}
.answer-input.correct-ans {
  border-color: var(--green);
  background: var(--green-bg);
  color: var(--green);
  box-shadow: 0 0 0 4px rgba(26,122,85,0.1);
}
.answer-input.wrong-ans {
  border-color: var(--red);
  background: var(--red-bg);
  color: var(--red);
  box-shadow: 0 0 0 4px rgba(192,57,43,0.1);
}

/* ── FEEDBACK ── */
.feedback {
  margin-top: 12px;
  padding: 12px 16px;
  border-radius: var(--radius);
  font-size: 14px;
  font-weight: 500;
  display: none;
  align-items: center;
  gap: 8px;
}
.feedback.show-correct {
  display: flex;
  background: var(--green-bg);
  color: var(--green);
  border: 1px solid rgba(26,122,85,0.2);
}
.feedback.show-wrong {
  display: flex;
  background: var(--red-bg);
  color: var(--red);
  border: 1px solid rgba(192,57,43,0.2);
}
.feedback .correct-word {
  font-family: 'DM Mono', monospace;
  font-size: 15px;
}

/* ── QUIZ BUTTONS ── */
.btn-row {
  display: flex;
  gap: 10px;
  margin-top: 16px;
}
.btn-skip {
  flex: 0 0 auto;
  padding: 13px 20px;
  border: 1.5px solid var(--border2);
  border-radius: var(--radius-lg);
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  background: transparent;
  color: var(--text2);
  font-family: 'Sora', sans-serif;
  transition: all 0.13s;
}
.btn-skip:hover { border-color: var(--text); color: var(--text); }
.btn-check {
  flex: 1;
  padding: 13px;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: var(--radius-lg);
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  font-family: 'Sora', sans-serif;
  transition: opacity 0.15s, transform 0.1s;
}
.btn-check:hover { opacity: 0.88; }
.btn-check:active { transform: scale(0.98); }
.btn-check.next-mode {
  background: var(--green);
}

/* ── RESULTS ── */
.score-ring-wrap {
  display: flex;
  justify-content: center;
  margin: 8px 0 20px;
}
.score-ring {
  width: 110px;
  height: 110px;
  border-radius: 50%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  border: 3px solid var(--border);
  background: var(--surface);
}
.score-ring.great { border-color: var(--green); background: var(--green-bg); }
.score-ring.ok { border-color: var(--amber); background: var(--amber-bg); }
.score-ring.poor { border-color: var(--red); background: var(--red-bg); }
.score-num {
  font-size: 32px;
  font-weight: 600;
  line-height: 1;
  font-family: 'DM Mono', monospace;
}
.score-ring.great .score-num { color: var(--green); }
.score-ring.ok .score-num { color: var(--amber); }
.score-ring.poor .score-num { color: var(--red); }
.score-label { font-size: 11px; font-weight: 500; color: var(--text3); margin-top: 2px; }

.stats-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 14px;
}
.stat-box {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 14px 10px;
  text-align: center;
}
.stat-num-big {
  font-size: 26px;
  font-weight: 600;
  font-family: 'DM Mono', monospace;
  line-height: 1;
}
.stat-num-big.c-green { color: var(--green); }
.stat-num-big.c-red { color: var(--red); }
.stat-lbl { font-size: 11px; color: var(--text3); margin-top: 4px; }

.best-score-badge {
  text-align: center;
  font-size: 12px;
  font-weight: 500;
  color: var(--text3);
  margin-bottom: 16px;
  padding: 8px 12px;
  background: var(--surface2);
  border-radius: var(--radius);
  border: 1px solid var(--border);
}
.best-score-badge .hl { color: var(--accent); font-family: 'DM Mono', monospace; font-size: 14px; }

.mistakes-title {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text3);
  margin-bottom: 10px;
}
.mistakes-list { max-height: 200px; overflow-y: auto; }
.mistake-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 9px 0;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
  gap: 8px;
}
.mistake-row:last-child { border-bottom: none; }
.m-left { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.m-verb { font-weight: 600; color: var(--text); }
.m-ctx { font-size: 11px; color: var(--text3); background: var(--surface2); padding: 2px 6px; border-radius: 4px; border: 1px solid var(--border); }
.m-right-side { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.m-wrong-ans { color: var(--red); font-family: 'DM Mono', monospace; font-size: 12px; text-decoration: line-through; }
.m-arrow { color: var(--text3); font-size: 11px; }
.m-correct-ans { color: var(--green); font-family: 'DM Mono', monospace; font-size: 12px; font-weight: 500; }

.res-btn-row { display: flex; gap: 10px; margin-top: 14px; }
.btn-outline {
  flex: 1;
  padding: 13px;
  border: 1.5px solid var(--border2);
  border-radius: var(--radius-lg);
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  background: transparent;
  color: var(--text);
  font-family: 'Sora', sans-serif;
  transition: all 0.13s;
}
.btn-outline:hover { border-color: var(--accent); color: var(--accent); }
.btn-solid {
  flex: 1;
  padding: 13px;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: var(--radius-lg);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  font-family: 'Sora', sans-serif;
  transition: opacity 0.15s;
}
.btn-solid:hover { opacity: 0.88; }

/* ── SCROLLBAR ── */
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 10px; }

/* ── MOBILE ── */
@media (max-width: 480px) {
  .app { padding: 16px 12px 60px; }
  .verb-grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); max-height: 180px; }
  .verb-big { font-size: 32px; }
  .verb-big.perfect-mode { font-size: 24px; }
  .pronoun-tag { font-size: 15px; padding: 3px 12px; }
  .answer-input { font-size: 18px; padding: 12px 14px; }
  .stats-grid { gap: 8px; }
  .stat-num-big { font-size: 22px; }
  .mode-btn { min-width: 80px; font-size: 12px; padding: 8px 8px; }
  .score-ring { width: 96px; height: 96px; }
  .score-num { font-size: 28px; }
  .btn-check, .btn-outline, .btn-solid { font-size: 14px; }
}
</style>
</head>
<body>
<div class="app">
  <header class="site-header">
    <div class="lang-switcher">
      <button class="lang-btn active" onclick="setLang('en',this)">EN</button>
      <button class="lang-btn" onclick="setLang('nl',this)">NL</button>
    </div>
    <div class="site-title">Dutch Verb Trainer</div>
  </header>

  <!-- ══ SETUP SCREEN ══ -->
  <div id="screen-setup" class="screen active">

    <div class="card">
      <div class="card-title" data-i18n="verbType">Verb type</div>
      <div class="type-pills">
        <button class="pill active" onclick="setType('all')" data-i18n="allVerbs">All verbs</button>
        <button class="pill" onclick="setType('irregular')" data-i18n="irregularOnly">Irregular only</button>
        <button class="pill" onclick="setType('regular')" data-i18n="regularOnly">Regular only</button>
      </div>
    </div>

    <div class="card">
      <div class="card-title" data-i18n="selectVerbs">Select verbs</div>
      <div class="select-actions">
        <button onclick="selectAll()" data-i18n="selectAll">Select all</button>
        <button onclick="selectNone()" data-i18n="clearAll">Clear all</button>
      </div>
      <div class="verb-grid" id="verb-grid"></div>
    </div>

    <div class="card">
      <div class="card-title" style="margin-bottom:10px" data-i18n="tense">Tense</div>
      <div class="mode-row" id="tense-row">
        <button class="mode-btn active" onclick="setTense('present',this)" data-i18n="present">Present</button>
        <button class="mode-btn" onclick="setTense('past',this)" data-i18n="past">Past</button>
        <button class="mode-btn" onclick="setTense('perfect',this)" data-i18n="participle">Participle</button>
        <button class="mode-btn" onclick="setTense('all',this)" data-i18n="all">All</button>
      </div>
      <div class="card-title" style="margin-top:16px;margin-bottom:10px" data-i18n="questionOrder">Question order</div>
      <div class="mode-row" id="order-row">
        <button class="mode-btn active" onclick="setOrder('random',this)" data-i18n="random">Random</button>
        <button class="mode-btn" onclick="setOrder('norep',this)" data-i18n="noRepeat">No repeat</button>
        <button class="mode-btn" onclick="setOrder('fixed',this)" data-i18n="fixed">Fixed</button>
      </div>
    </div>

    <button class="start-btn" id="start-btn" onclick="startQuiz()" disabled data-i18n="selectToStart">Select verbs to start</button>
  </div>

  <!-- ══ QUIZ SCREEN ══ -->
  <div id="screen-quiz" class="screen">
    <div class="quiz-topbar">
      <span class="q-counter" id="q-counter">1 / 10</span>
      <button class="quit-btn" onclick="goSetup()" data-i18n="quit">✕ Quit</button>
    </div>
    <div class="progress-wrap">
      <div class="progress-fill" id="progress-fill" style="width:0%"></div>
    </div>

    <div class="card" style="text-align:center">
      <div style="display:flex;justify-content:center;margin-bottom:14px">
        <span class="tense-badge" id="tense-badge">Present simple</span>
      </div>

      <div class="quiz-center" id="quiz-center">
        <div class="pronoun-tag-wrap" id="pronoun-tag-wrap">
          <span class="pronoun-label-small" id="pronoun-label-small">voor</span>
          <span class="pronoun-tag" id="pronoun-tag">ik</span>
        </div>
        <div class="verb-big" id="q-verb">—</div>
      </div>

      <div class="answer-wrap">
        <input
          class="answer-input"
          id="answer-input"
          type="text"
          placeholder="type answer…"
          autocomplete="off"
          autocorrect="off"
          autocapitalize="off"
          spellcheck="false"
        >
        <div class="feedback" id="feedback"></div>
      </div>

      <div class="btn-row">
        <button class="btn-skip" id="skip-btn" onclick="skipQ()" data-i18n="skip">Skip</button>
        <button class="btn-check" id="check-btn" onclick="checkOrNext()" data-i18n="check">Check</button>
      </div>
    </div>
  </div>

  <!-- ══ RESULTS SCREEN ══ -->
  <div id="screen-results" class="screen">
    <div class="card">
      <div class="score-ring-wrap">
        <div class="score-ring" id="score-ring">
          <div class="score-num" id="score-num">—</div>
          <div class="score-label" data-i18n="score">score</div>
        </div>
      </div>

      <div class="stats-grid">
        <div class="stat-box">
          <div class="stat-num-big c-green" id="res-correct">—</div>
          <div class="stat-lbl" data-i18n="correct">Correct</div>
        </div>
        <div class="stat-box">
          <div class="stat-num-big c-red" id="res-wrong">—</div>
          <div class="stat-lbl" data-i18n="wrong">Wrong</div>
        </div>
        <div class="stat-box">
          <div class="stat-num-big" id="res-total">—</div>
          <div class="stat-lbl" data-i18n="total">Total</div>
        </div>
      </div>

      <div class="best-score-badge" id="best-badge"></div>
    </div>

    <div class="card" id="mistakes-card" style="display:none">

let selectedVerbs = new Set();
let verbType = 'all';
let tenseMode = 'present';
let orderMode = 'random';
let questions = [];
let qIndex = 0;
let correctCount = 0;
let wrongCount = 0;
let mistakes = [];
let answered = false;

function getAllVerbs() {
  let pool = {};
  if (verbType === 'all' || verbType === 'irregular') Object.assign(pool, IRREGULAR);
  if (verbType === 'all' || verbType === 'regular') Object.assign(pool, REGULAR);
  return pool;
}

function renderVerbGrid() {
  const grid = document.getElementById('verb-grid');
  grid.innerHTML = '';
  const pool = getAllVerbs();
  Object.keys(pool).sort().forEach(v => {
    const chip = document.createElement('div');
    chip.className = 'verb-chip' + (selectedVerbs.has(v) ? ' selected' : '');
    chip.dataset.verb = v;
    chip.innerHTML = `<div class="chk"></div>${v}`;
    chip.onclick = () => {
      if (selectedVerbs.has(v)) { selectedVerbs.delete(v); chip.classList.remove('selected'); }
      else { selectedVerbs.add(v); chip.classList.add('selected'); }
      updateStartBtn();
    };
    grid.appendChild(chip);
  });
  updateStartBtn();
}

function setType(t) {
  verbType = t;
  document.querySelectorAll('.type-pills .pill').forEach((p, i) => {
    p.classList.toggle('active', ['all','irregular','regular'][i] === t);
  });
  const prev = [...selectedVerbs];
  selectedVerbs.clear();
  renderVerbGrid();
  const pool = getAllVerbs();
  prev.forEach(v => { if (pool[v]) selectedVerbs.add(v); });
  document.querySelectorAll('.verb-chip').forEach(c => {
    c.classList.toggle('selected', selectedVerbs.has(c.dataset.verb));
  });
  updateStartBtn();
}

function selectAll() {
  const pool = getAllVerbs();
  Object.keys(pool).forEach(v => selectedVerbs.add(v));
  document.querySelectorAll('.verb-chip').forEach(c => c.classList.add('selected'));
  updateStartBtn();
}

function selectNone() {
  selectedVerbs.clear();
  document.querySelectorAll('.verb-chip').forEach(c => c.classList.remove('selected'));
  updateStartBtn();
}

function setTense(m, btn) {
  tenseMode = m;
  document.querySelectorAll('#tense-row .mode-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

function setOrder(o, btn) {
  orderMode = o;
  document.querySelectorAll('#order-row .mode-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

let lang = 'en';

function t(key) { return I18N[lang][key]; }

function setLang(l, btn) {
  lang = l;
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  applyTranslations();
  updateStartBtn();
}

function applyTranslations() {
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.dataset.i18n;
    if (I18N[lang][key] && typeof I18N[lang][key] === 'string') {
      el.textContent = I18N[lang][key];
    }
  });
}

function updateStartBtn() {
  const btn = document.getElementById('start-btn');
  const n = selectedVerbs.size;
  btn.disabled = n === 0;
  btn.textContent = n === 0 ? t('selectToStart') : t('startPractice')(n);
}

function buildQuestions() {
  const pool = getAllVerbs();
  const persons = ['ik','jij','hij','wij','jullie','zij'];
  const tenses = tenseMode === 'all' ? ['present','past','perfect'] : [tenseMode];
  let qs = [];
  [...selectedVerbs].forEach(v => {
    const data = pool[v];
    tenses.forEach(t => {
      if (t === 'perfect') {
        qs.push({ verb: v, tense: 'perfect', person: null, answer: data.perfect });
      } else {
        persons.forEach(p => {
          qs.push({ verb: v, tense: t, person: p, answer: data[t][p] });
        });
      }
    });
  });
  if (orderMode !== 'fixed') {
    for (let i = qs.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [qs[i], qs[j]] = [qs[j], qs[i]];
    }
  }
  const limit = orderMode === 'norep' ? Math.min(qs.length, 20) : Math.min(qs.length, 40);
  return qs.slice(0, limit);
}

function startQuiz() {
  questions = buildQuestions();
  qIndex = 0; correctCount = 0; wrongCount = 0; mistakes = []; answered = false;
  showScreen('screen-quiz');
  showQuestion();
}

function showQuestion() {
  if (qIndex >= questions.length) { showResults(); return; }
  answered = false;
  const q = questions[qIndex];
  const total = questions.length;
  const L = I18N[lang];

  document.getElementById('q-counter').textContent = `${qIndex + 1} / ${total}`;
  document.getElementById('progress-fill').style.width = Math.round(qIndex / total * 100) + '%';
  document.getElementById('tense-badge').textContent = L.tenseBadge[q.tense];

  const verbEl = document.getElementById('q-verb');
  const pronounWrap = document.getElementById('pronoun-tag-wrap');
  const pronounTag = document.getElementById('pronoun-tag');
  const pronounLabel = document.getElementById('pronoun-label-small');

  if (q.tense === 'perfect') {
    verbEl.textContent = q.verb;
    verbEl.className = 'verb-big perfect-mode';
    pronounTag.textContent = L.particpleLabel;
    pronounLabel.textContent = '';
    pronounWrap.style.display = 'none';
  } else {
    verbEl.textContent = q.verb;
    verbEl.className = 'verb-big';
    pronounLabel.textContent = L.pronounLabel;
    pronounTag.textContent = q.person;
    pronounWrap.style.display = 'flex';
  }

  const inp = document.getElementById('answer-input');
  inp.value = ''; inp.className = 'answer-input'; inp.disabled = false;
  inp.placeholder = q.tense === 'perfect' ? L.placeholderPerfect : L.placeholderPerson(q.person);
  setTimeout(() => inp.focus(), 50);

  document.getElementById('feedback').className = 'feedback';
  document.getElementById('feedback').innerHTML = '';
  document.getElementById('check-btn').textContent = L.check;
  document.getElementById('check-btn').classList.remove('next-mode');
  document.getElementById('skip-btn').textContent = L.skip;
  document.getElementById('skip-btn').disabled = false;
}

function checkOrNext() {
  if (answered) { qIndex++; showQuestion(); return; }
  const q = questions[qIndex];
  const inp = document.getElementById('answer-input');
  const val = inp.value.trim().toLowerCase();
  if (!val) return;
  const L = I18N[lang];

  answered = true;
  inp.disabled = true;
  const correct_ans = q.answer.toLowerCase();
  const fb = document.getElementById('feedback');
  const checkBtn = document.getElementById('check-btn');
  const skipBtn = document.getElementById('skip-btn');

  if (val === correct_ans) {
    inp.className = 'answer-input correct-ans';
    fb.className = 'feedback show-correct';
    fb.innerHTML = L.feedbackCorrect;
    correctCount++;
  } else {
    inp.className = 'answer-input wrong-ans';
    fb.className = 'feedback show-wrong';
    fb.innerHTML = L.feedbackWrong(q.answer);
    wrongCount++;
    mistakes.push({ verb: q.verb, tense: q.tense, person: q.person, yours: inp.value.trim(), correct: q.answer });
  }

  checkBtn.textContent = qIndex + 1 >= questions.length ? L.seeResults : L.nextBtn;
  checkBtn.classList.add('next-mode');
  skipBtn.disabled = true;
}

function skipQ() {
  if (answered) return;
  const q = questions[qIndex];
  wrongCount++;
  mistakes.push({ verb: q.verb, tense: q.tense, person: q.person, yours: '—', correct: q.answer });
  qIndex++;
  showQuestion();
}

function handleKey(e) {
  if (e.key !== 'Enter') return;
  const quizActive = document.getElementById('screen-quiz').classList.contains('active');
  if (!quizActive) return;
  e.preventDefault();
  if (answered) { qIndex++; showQuestion(); }
  else {
    const val = document.getElementById('answer-input').value.trim();
    if (val) checkOrNext();
  }
}
document.addEventListener('keydown', handleKey);

function showResults() {
  const total = correctCount + wrongCount;
  const pct = total ? Math.round(correctCount / total * 100) : 0;
  const L = I18N[lang];

  document.getElementById('score-num').textContent = pct + '%';
  document.getElementById('res-correct').textContent = correctCount;
  document.getElementById('res-wrong').textContent = wrongCount;
  document.getElementById('res-total').textContent = total;

  const ring = document.getElementById('score-ring');
  ring.className = 'score-ring ' + (pct >= 80 ? 'great' : pct >= 50 ? 'ok' : 'poor');

  const prev = parseInt(localStorage.getItem('dutch_best') || '0');
  const badge = document.getElementById('best-badge');
  if (pct > prev) {
    localStorage.setItem('dutch_best', pct);
    badge.innerHTML = L.newBest(prev);
  } else {
    badge.innerHTML = L.bestScore(prev);
  }

  const mistakesCard = document.getElementById('mistakes-card');
  if (mistakes.length) {
    mistakesCard.style.display = 'block';
    document.getElementById('mistakes-list').innerHTML = mistakes.map(m => {
      const ctx = m.person ? `${m.person} · ${L.tenseShort[m.tense]}` : L.tenseShort[m.tense];
      return `<div class="mistake-row">
        <div class="m-left">
          <span class="m-verb">${m.verb}</span>
          <span class="m-ctx">${ctx}</span>
        </div>
        <div class="m-right-side">
          <span class="m-wrong-ans">${m.yours}</span>
          <span class="m-arrow">→</span>
          <span class="m-correct-ans">${m.correct}</span>
        </div>
      </div>`;
    }).join('');
  } else {
    mistakesCard.style.display = 'none';
  }

  applyTranslations();
  showScreen('screen-results');
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function goSetup() {
  showScreen('screen-setup');
  renderVerbGrid();
}

applyTranslations();
renderVerbGrid();
selectAll();
</script>
